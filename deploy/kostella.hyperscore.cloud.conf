# Kostella — situs pitch statis (Next.js `output: 'export'`).
#
# Target: /etc/nginx/sites-available/kostella.hyperscore.cloud.conf
#         symlink ke /etc/nginx/sites-enabled/
# Pasang dengan: sudo bash deploy/install-nginx.sh
#
# Bentuk HTTP (port 80). Certbot menambahkan blok TLS dan redirect 80->443:
#   sudo certbot --nginx -d kostella.hyperscore.cloud
#
# Tidak ada proses aplikasi di belakang ini. `current` menunjuk folder hasil
# build; deploy berikutnya cukup git pull + npm run build, nginx tak disentuh.

server {
    server_name kostella.hyperscore.cloud;

    root /srv/www/kostella/current;
    index index.html;

    access_log /var/log/nginx/kostella.access.log;
    error_log  /var/log/nginx/kostella.error.log;

    # `trailingSlash` di next.config membuat tiap route jadi folder berisi
    # index.html, jadi $uri/ menyelesaikan /pencarian/ tanpa rewrite.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Halaman 404 Next dengan status 404 yang sebenarnya. Menyajikannya dengan
    # status 200 membuat mesin pencari mengindeksnya sebagai halaman sah.
    error_page 404 /404/index.html;
    location = /404/index.html { internal; }

    # Aset ber-hash: namanya berubah tiap build, jadi aman di-cache selamanya.
    #
    # `^~` supaya .svg atau .woff2 di bawah path ini tetap memakai kebijakan
    # immutable — tanpa itu blok regex di bawah yang menang, karena nginx
    # memeriksa location regex lebih dulu daripada prefix biasa.
    #
    # Satu `add_header` dan tanpa `expires`: `expires` memancarkan
    # Cache-Control-nya sendiri, dan keduanya bersama mengirim header itu dua
    # kali. Terverifikasi lewat curl, bukan diasumsikan.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # HTML tidak boleh di-cache lama: build baru harus langsung terlihat.
    # Kena juga untuk /pencarian/ dan /detail/, karena `index` melakukan
    # internal redirect ke .../index.html sebelum location dicocokkan ulang.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(jpg|jpeg|png|svg|webp|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Situs statis; tidak ada yang perlu dibaca dari file tersembunyi.
    location ~ /\. { deny all; }
}
