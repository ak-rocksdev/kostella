<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;background:var(--stone);font-family:var(--font-body)}
.sec{padding:14px 20px;border-bottom:1px solid var(--line)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--plum)}a:hover{color:var(--ink)}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Button, Chip, Badge, StatusBadge, Input, Eyebrow, FloorGrid, FloorGridLegend, PropertyCard, ReceiptTable, MetricCard, ProofBar } = window.KostellaDesignSystem_f6d153;
function Card() {

    </div></div>
    <div className="sec"><span className="lb">Input · Eyebrow</span><div className="row" style={{alignItems:'flex-end'}}>
