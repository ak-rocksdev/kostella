<!-- @dsCard group="Brand" viewport="700x220" name="Floor grid motif" subtitle="Signature: open with inventory, not photos" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);background:var(--paper);height:220px;display:flex;align-items:center;justify-content:center}
.g{display:grid;grid-template-columns:90px 1fr;row-gap:10px;column-gap:20px;align-items:center}
.fl{font:600 12px var(--font-body);letter-spacing:0.08em;color:var(--ink-soft);text-transform:uppercase}
.row{display:flex;gap:8px}
.c{width:64px;height:48px;display:flex;align-items:center;justify-content:center;font:500 14px var(--font-mono)}
.av{border:2px solid var(--available);color:#fff;background:var(--available)}
.hd{border:1px solid var(--held);color:var(--held);background:repeating-linear-gradient(45deg,#fff 0 4px,#F5E3D7 4px 8px)}
.oc{border:1px solid var(--line);color:#B7B5AF;background:#E7E5E0}
a{color:var(--plum)}a:hover{color:var(--ink)}</style></head><body>
<div class="g">
<span class="fl">Lantai 3</span><div class="row"><div class="c oc">304</div></div>
<span class="fl">Lantai 2</span><div class="row"><div class="c hd">205</div><div class="c oc">208</div><div class="c av">211</div><div class="c oc">212</div></div>
<span class="fl">Lantai 1</span><div class="row"><div class="c oc">101</div><div class="c av">105</div><div class="c oc">107</div></div>
</div>
</body></html>
