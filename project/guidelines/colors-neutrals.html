<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Stone page, paper cards, ink text, 1px lines" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);display:flex;height:150px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px}
.n{font-size:12px;font-weight:600;color:var(--ink)}.h{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft)}
a{color:var(--plum)}a:hover{color:var(--ink)}</style></head><body>
<div class="sw" style="background:var(--stone)"><span class="n">--stone</span><span class="h">#EDECE7</span></div>
<div class="sw" style="background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><span class="n">--paper</span><span class="h">#FFFFFF</span></div>
<div class="sw" style="background:var(--line)"><span class="n">--line</span><span class="h">#D9D7D0</span></div>
<div class="sw" style="background:var(--ink-soft)"><span class="n" style="color:#fff">--ink-soft</span><span class="h" style="color:#D9D7D0">#5E5F62</span></div>
<div class="sw" style="background:var(--ink)"><span class="n" style="color:var(--stone)">--ink</span><span class="h" style="color:#9A9892">#16171A</span></div>
</body></html>
