<!-- @dsCard group="Colors" viewport="700x170" name="Status" subtitle="Availability only, never decoration — and never color alone" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);display:flex;height:170px;background:var(--paper)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.col+.col{border-left:1px solid var(--line)}
.cell{width:72px;height:56px;display:flex;align-items:center;justify-content:center;font:500 15px var(--font-mono);border-radius:0}
.n{font-size:12px;font-weight:600;color:var(--ink)}.h{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft)}
a{color:var(--plum)}a:hover{color:var(--ink)}</style></head><body>
<div class="col"><div class="cell" style="border:3px solid var(--available);color:#fff;background:var(--available);font-weight:500">105</div><span class="n">Tersedia</span><span class="h">--available #2E7D52</span></div>
<div class="col"><div class="cell" style="border:1px solid var(--held);color:var(--held);background:repeating-linear-gradient(45deg,#fff 0 4px,#F5E3D7 4px 8px)">205</div><span class="n">Dibooking</span><span class="h">--held #B4531E</span></div>
<div class="col"><div class="cell" style="border:1px solid var(--line);color:#B7B5AF;background:#E7E5E0">208</div><span class="n">Terisi</span><span class="h">--occupied #9A9892</span></div>
</body></html>
