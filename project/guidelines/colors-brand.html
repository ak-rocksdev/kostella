<!-- @dsCard group="Colors" viewport="700x150" name="Brand — plum" subtitle="One action color; max two non-neutrals per screen" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);display:flex;height:150px;background:var(--stone)}
.sw{flex:1.2;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px}
.n{font-size:12px;font-weight:600}.h{font-family:var(--font-mono);font-size:11px}
.use{flex:2;display:flex;flex-direction:column;gap:10px;align-items:flex-start;justify-content:center;padding:0 24px;border-left:1px solid var(--line)}
.btn{background:var(--plum);color:#fff;font:600 14px var(--font-body);padding:10px 20px;border-radius:var(--radius-badge);border:none}
.badge{background:var(--plum-soft);color:var(--plum);font:600 12px var(--font-body);padding:4px 10px;border-radius:var(--radius-badge)}
a{color:var(--plum)}a:hover{color:var(--ink)}</style></head><body>
<div class="sw" style="background:var(--plum)"><span class="n" style="color:#fff">--plum</span><span class="h" style="color:var(--plum-soft)">#57182F</span></div>
<div class="sw" style="background:var(--plum-soft)"><span class="n" style="color:var(--plum)">--plum-soft</span><span class="h" style="color:var(--plum)">#F3E7EA</span></div>
<div class="use"><button class="btn">Jadwalkan survei</button><span class="badge">Khusus putri</span></div>
</body></html>
