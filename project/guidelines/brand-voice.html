<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);background:var(--stone);height:160px;display:flex;align-items:center;justify-content:center;gap:20px;padding:0 24px;box-sizing:border-box}

.t{font-size:14px;line-height:1.6;color:var(--ink);margin:0}
.l{font:600 11px var(--font-body);letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:6px}
a{color:var(--plum)}a:hover{color:var(--ink)}</style></head><body>
<div class="q"><span class="l">Penyewa — kamu</span><p class="t">Yang kamu bayar, tanpa kejutan.</p></div>
<div class="q" style="background:var(--ink);border-color:var(--ink)"><span class="l" style="color:#9A9892">Pemilik — Anda</span><p class="t" style="color:var(--stone)">Kami mengelola 31 gedung. Kami juga bisa mengelola milik Anda.</p></div>
