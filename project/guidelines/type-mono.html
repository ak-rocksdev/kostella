<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--paper);height:190px;display:flex;align-items:center;justify-content:center}
.receipt{font-family:var(--font-mono);font-size:14px;line-height:1.9;color:var(--ink)}
.row{display:flex;justify-content:space-between;gap:48px}.row span:last-child{text-align:right}
.total{border-top:1px solid var(--ink);font-weight:500;margin-top:4px;padding-top:4px}
.soft{color:var(--ink-soft)}
a{color:var(--plum)}a:hover{color:var(--ink)}</style></head><body>
<div class="receipt">
<div class="row"><span>Sewa bulanan</span><span>Rp 1.650.000</span></div>
<div class="row"><span>Deposit (dikembalikan)</span><span>Rp 1.500.000</span></div>
<div class="row"><span>Listrik</span><span class="soft">dihitung terpisah</span></div>
<div class="row"><span>Parkir motor</span><span class="soft">gratis</span></div>
<div class="row total"><span>Bayar di awal</span><span>Rp 3.150.000</span></div>
</div>
</body></html>
