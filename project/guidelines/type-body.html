<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);background:var(--paper);height:180px;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 32px;box-sizing:border-box;color:var(--ink)}
